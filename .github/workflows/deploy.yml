name: Deploy Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build Docusaurus
        working-directory: website
        run: npm run build

      - name: Expose Markdown sources, sitemap and LLM files
        run: |
          set -euo pipefail

          mkdir -p website/build/markdown

          # Export the version the site serves at its root: /markdown/, llms.txt
          # and llms-full.txt present themselves as the official documentation,
          # so they must not ship a version the HTML site does not show.
          # Following `lastVersion` keeps them in step with no edit here.
          LAST_VERSION="$(sed -n "s/^ *lastVersion: *'\([^']*\)'.*/\1/p" \
            website/docusaurus.config.ts | head -1)"

          if [ -z "$LAST_VERSION" ] || [ "$LAST_VERSION" = "current" ]; then
            DOCS_DIR="website/docs"
          else
            DOCS_DIR="website/versioned_docs/version-$LAST_VERSION"
          fi

          if [ ! -d "$DOCS_DIR" ]; then
            echo "Docs folder not found: $DOCS_DIR (lastVersion='$LAST_VERSION')"
            exit 1
          fi

          echo "Exporting Markdown from $DOCS_DIR (lastVersion='$LAST_VERSION')"

          rsync -av \
            --include='*/' \
            --include='*.md' \
            --include='*.mdx' \
            --exclude='*' \
            "$DOCS_DIR/" website/build/markdown/

          # No robots.txt here: website/static/robots.txt is the only one, and it
          # already declares both sitemaps. Writing one after the build would
          # overwrite its per-crawler rules.

          # Page HTML d'index pour /markdown/
          {
            echo '<!doctype html>'
            echo '<html lang="en">'
            echo '<head>'
            echo '  <meta charset="utf-8">'
            echo '  <meta name="viewport" content="width=device-width, initial-scale=1">'
            echo '  <title>Hortval Markdown Documentation</title>'
            echo '  <meta name="description" content="Raw Markdown sources for the Hortval documentation.">'
            echo '</head>'
            echo '<body>'
            echo '  <h1>Hortval Markdown Documentation</h1>'
            echo '  <p>Raw Markdown sources for the Hortval documentation.</p>'
            echo '  <ul>'

            find website/build/markdown -type f \( -name '*.md' -o -name '*.mdx' \) | sort | while read -r file; do
              rel="${file#website/build/markdown/}"
              url="/markdown/$rel"
              title="$rel"
              echo "    <li><a href=\"$url\">$title</a></li>"
            done

            echo '  </ul>'
            echo '  <p><a href="/llms.txt">llms.txt</a> · <a href="/llms-full.txt">llms-full.txt</a> · <a href="/markdown-sitemap.xml">Markdown sitemap</a></p>'
            echo '</body>'
            echo '</html>'
          } > website/build/markdown/index.html

          # llms.txt
          cat > website/build/llms.txt <<'EOF'
          # Hortval Documentation

          > Official documentation for Hortval, an on-premise ACME server for Microsoft ADCS.

          Hortval was called **Certeasy** until August 2026. It is the same
          product: 0.9.5 is the first release to carry the new name, and the
          binary and its commands are named `hortval`. The pages exported here
          are the docs for that release. Documentation for 0.9.4 and earlier,
          where the binary is still named `certeasy`, stays available under the
          versioned pages.

          ## Main resources

          - [Documentation website](https://docs.hortval.com/)
          - [Markdown index](https://docs.hortval.com/markdown/)
          - [Full Markdown export](https://docs.hortval.com/llms-full.txt)
          - [Markdown sitemap](https://docs.hortval.com/markdown-sitemap.xml)
          - [Hortval website](https://hortval.com/)

          ## Suggested entry points

          - Installation
          - Minimal configuration
          - Microsoft ADCS integration
          - ACME clients
          - Licensing
          - Troubleshooting
          EOF

          # llms-full.txt
          {
            echo "# Hortval Documentation Full Export"
            echo
            echo "Source: https://docs.hortval.com/"
            echo
            echo "---"
            echo

            find website/build/markdown -type f \( -name '*.md' -o -name '*.mdx' \) | sort | while read -r file; do
              rel="${file#website/build/markdown/}"
              echo
              echo "---"
              echo
              echo "# ${rel}"
              echo
              cat "$file"
              echo
            done
          } > website/build/llms-full.txt

          # Sitemap XML dédié aux fichiers Markdown
          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'

            echo '  <url>'
            echo '    <loc>https://docs.hortval.com/markdown/</loc>'
            echo '  </url>'

            find website/build/markdown -type f \( -name '*.md' -o -name '*.mdx' \) | sort | while read -r file; do
              rel="${file#website/build/markdown/}"
              echo '  <url>'
              echo "    <loc>https://docs.hortval.com/markdown/$rel</loc>"
              echo '  </url>'
            done

            echo '  <url>'
            echo '    <loc>https://docs.hortval.com/llms.txt</loc>'
            echo '  </url>'

            echo '  <url>'
            echo '    <loc>https://docs.hortval.com/llms-full.txt</loc>'
            echo '  </url>'

            echo '</urlset>'
          } > website/build/markdown-sitemap.xml

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4